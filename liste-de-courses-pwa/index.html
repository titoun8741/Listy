<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liste de courses</title>
<meta name="theme-color" content="#b9d0bb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Courses">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --page:#b9d0bb; --paper:#fbfaf6; --mint:#e3eedf; --forest:#55794a; --forest-deep:#3d5a35; --line:#c3d6bf;
  --pink:#b5566d; --pink-btn:#bf5a72; --pink-soft:#f7ecee; --muted:#6b8363;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#243528; --paper:#1b281f; --mint:#26392d; --forest:#a8d796; --forest-deep:#cfe8c3; --line:#35503c;
    --pink:#f0a0b2; --pink-btn:#b85670; --pink-soft:#2c2429; --muted:#8fb085; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#243528; --paper:#1b281f; --mint:#26392d; --forest:#a8d796; --forest-deep:#cfe8c3; --line:#35503c;
  --pink:#f0a0b2; --pink-btn:#b85670; --pink-soft:#2c2429; --muted:#8fb085; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--forest-deep);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4;min-height:100vh}
.phone{max-width:26rem;margin:0 auto;background:var(--paper);border:2px solid var(--line);border-radius:2rem;padding:1.25rem 1.25rem 0;overflow:hidden;position:relative}
.wrap{padding:1rem 1rem 2rem}
.bar{text-align:center;font-family:"Fredoka","Baloo 2","Nunito",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;font-weight:600;font-size:1.5rem;line-height:1;letter-spacing:.02em;color:var(--forest);margin:0 0 1.25rem}
.bar::after{content:"";display:inline-block;width:.38rem;height:.38rem;border-radius:50%;background:var(--pink);margin-left:.15rem}
h1{font-size:clamp(1.05rem,5.6vw,1.6rem);white-space:nowrap;font-weight:900;text-align:center;color:var(--forest);margin:0 0 .25rem;line-height:1.2}
.sub{text-align:center;color:var(--pink);font-weight:700;margin:0 0 1.25rem}
form{display:flex;gap:.5rem;margin-bottom:1.25rem}
input[type=text]{flex:1;min-width:0;font:inherit;padding:.75rem 1.1rem;border:2px solid var(--line);border-radius:2rem;background:transparent;color:var(--forest-deep)}
input[type=text]::placeholder{color:var(--muted)}
input[type=text]:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.add{font:inherit;font-weight:700;padding:.75rem 1.1rem;border:0;border-radius:2rem;background:var(--forest);color:var(--paper);cursor:pointer}
.mini{font:inherit;font-weight:700;font-size:.85rem;border:0;border-radius:2rem;padding:.4rem .8rem;background:var(--forest);color:var(--paper);cursor:pointer}
.share{margin:0 0 1.25rem;border:1.5px solid var(--line);border-radius:1.2rem;padding:.6rem 1rem}
.share summary{cursor:pointer;font-weight:700;color:var(--forest)}
.share p{margin:.6rem 0 0;font-size:.9rem;color:var(--muted)}
.share strong{color:var(--forest-deep);letter-spacing:.02em}
.share form{margin:.6rem 0 0}
.share input[type=text]{padding:.45rem .9rem;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;align-content:flex-start;align-items:center;height:calc(2.1rem + 6px);overflow:hidden;padding:3px;margin:calc(-.5rem - 3px) -3px calc(1rem - 3px)}
.chips:empty{display:none}
.chips .lbl{color:var(--muted);font-size:.85rem;margin-right:.2rem;white-space:nowrap}
.chip{font:inherit;font-size:.9rem;border:1.5px solid var(--line);background:var(--paper);color:var(--forest-deep);border-radius:2rem;padding:0 .8rem;height:2.1rem;display:inline-flex;align-items:center;white-space:nowrap;cursor:pointer}
@media (hover:hover){.chip:hover{background:var(--mint)}}
.grp h2{display:flex;justify-content:space-between;font-size:1rem;font-weight:700;color:var(--forest);margin:1.1rem .25rem .45rem}
.grp:first-child h2{margin-top:0}
.grp h2 span{color:var(--muted);font-weight:500}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.7rem}
li{display:flex;align-items:center;gap:.6rem;padding:.7rem .9rem .7rem 1rem;background:var(--mint);border:1.5px solid var(--line);border-radius:1.4rem;box-shadow:0 2px 6px rgba(61,90,53,.08)}
li input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:1.6rem;height:1.6rem;margin:0;border:2px solid var(--forest);border-radius:50%;background:var(--paper);display:grid;place-content:center;cursor:pointer}
li input[type=checkbox]::after{content:"";width:.8rem;height:.8rem;border-radius:50%;background:var(--forest);transform:scale(0);transition:transform .15s}
li input[type=checkbox]:checked::after{transform:scale(1)}
li input[type=checkbox]:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
li .name{flex:1;min-width:0;font:inherit;font-weight:700;background:none;border:0;padding:0;color:inherit;text-align:left;cursor:text;overflow-wrap:anywhere}
li.done .name{color:var(--muted);text-decoration:line-through;font-weight:500}
.qty{flex:none;white-space:nowrap;font-weight:700;font-size:.9rem;color:var(--pink);background:var(--pink-soft);border-radius:2rem;padding:.15rem .7rem}
li.done .qty{opacity:.55}
.ini{flex:none;width:1.5rem;height:1.5rem;border-radius:50%;border:2px solid var(--line);background:var(--paper);display:grid;place-content:center;font-size:.72rem;font-weight:700;color:var(--forest-deep)}
.del{font:inherit;font-size:1.4rem;line-height:1;border:0;background:none;color:var(--forest);cursor:pointer;padding:.25rem .5rem;border-radius:.5rem}
@media (hover:hover){.del:hover{color:var(--pink)}}
.editf{margin:0;flex:1;min-width:0;gap:.35rem}
.ico{flex:none;width:2.25rem;height:2.25rem;padding:0;display:grid;place-content:center;font:inherit;font-size:1.05rem;font-weight:700;line-height:1;border:0;border-radius:50%;background:var(--forest);color:var(--paper);cursor:pointer}
.share .lbl{margin:.6rem 0 .25rem}
.share .row{margin-top:0;display:flex;flex-wrap:nowrap;align-items:center;gap:.5rem}
.share .row strong{flex:1;overflow-wrap:anywhere;min-width:0}

.share form .ico{flex:none}
.ico.no{background:var(--paper);color:var(--forest-deep);border:1.5px solid var(--line)}
li .edit{padding:.45rem .8rem;width:0}
li:has(.editf){padding:.55rem .6rem}
li.empty{justify-content:center;text-align:center;font-weight:500;background:transparent;border-style:dashed;color:var(--muted)}
.panel{margin:1.75rem -1.25rem 0;padding:1.25rem 1.5rem 1.5rem;background:var(--pink-soft);border-radius:2rem 2rem 0 0;text-align:center}
.panel p{margin:0 0 .75rem;color:var(--muted);font-size:.9rem}
.clear{width:100%;font:inherit;font-weight:500;font-size:1.1rem;border:0;border-radius:1rem;padding:.85rem 1rem;background:var(--pink-btn);color:#fff;cursor:pointer;box-shadow:0 3px 8px rgba(181,86,109,.2)}
.clear[disabled]{opacity:.45;cursor:default;box-shadow:none}
[hidden]{display:none!important}
.listbar{display:flex;gap:.4rem;align-items:flex-start;margin:0 0 .75rem}
.lists{flex:1;min-width:0;display:flex;gap:.4rem;overflow-x:auto;margin:0 -.25rem;padding:.1rem .25rem .4rem;scrollbar-width:thin}
.share-btn{margin-top:.1rem}
.share-btn{width:2.5rem;height:2.5rem}
.share-btn[aria-expanded="true"]{background:var(--mint)}
.tab{flex:none;min-height:2.5rem;font:inherit;font-weight:700;font-size:.9rem;border:1.5px solid var(--line);background:var(--paper);color:var(--forest-deep);border-radius:2rem;padding:.4rem 1rem;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--forest);color:var(--paper);border-color:var(--forest)}
.tab.new{border-style:dashed;color:var(--muted)}
.tab:not(.new){user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:1rem;background:rgba(20,30,22,.5)}
.dlg{width:100%;max-width:22rem;background:var(--paper);color:var(--forest-deep);border:2px solid var(--line);border-radius:1.5rem;padding:1.25rem;box-shadow:0 12px 32px rgba(0,0,0,.25)}
.dlg h2{margin:0 0 .5rem;font-size:1.15rem;font-weight:900;color:var(--forest);overflow-wrap:anywhere}
.dlg p{margin:0 0 1.1rem;color:var(--muted);font-size:.95rem}
.acts{display:flex;gap:.5rem;justify-content:flex-end}
.acts .mini{min-height:2.75rem;font-size:1rem;padding:.5rem 1.2rem}
#mNo{background:var(--mint);color:var(--forest-deep)}
#mYes{background:var(--pink-btn);color:#fff}
#mNo:focus-visible,#mYes:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
#auth{padding-bottom:1.25rem}
#authForm{flex-direction:column;margin-bottom:.5rem}
.field{font:inherit;padding:.75rem 1.1rem;border:2px solid var(--line);border-radius:2rem;background:transparent;color:var(--forest-deep);width:100%}
.field::placeholder{color:var(--muted)}
.field:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.add.plus{flex:none;width:2.5rem;height:2.5rem;padding:0;display:grid;place-content:center;border-radius:50%}
#form{position:relative}
#form input{width:100%;padding-right:3.6rem}
#form .add.plus{position:absolute;right:.35rem;top:50%;transform:translateY(-50%)}
#authForm .add{width:100%;min-height:2.9rem;font-size:1rem}
#authForm .add[disabled]{opacity:.55;cursor:default}
.amsg{min-height:1.4rem;margin:.25rem 0 .5rem;text-align:center;color:var(--pink);font-weight:700;font-size:.95rem}
.linkbtn{display:block;margin:0 auto 1rem;font:inherit;font-weight:700;font-size:.95rem;color:var(--forest);background:none;border:0;cursor:pointer;text-decoration:underline;padding:.5rem}
</style>
</head>
<body>
<div class="wrap">
<main class="phone">
  <p class="bar">Listy</p>
  <section id="auth" hidden>
    <h1 id="aTitle">Connexion</h1>
    <p class="sub">Retrouvez vos listes sur tous vos appareils</p>
    <form id="authForm" novalidate>
      <input class="field" type="text" id="aName" placeholder="Votre prénom" aria-label="Votre prénom" autocomplete="given-name" maxlength="20" hidden>
      <input class="field" type="email" id="aEmail" placeholder="Adresse e-mail" aria-label="Adresse e-mail" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false">
      <input class="field" type="password" id="aPass" placeholder="Mot de passe" aria-label="Mot de passe" autocomplete="current-password">
      <button class="add" id="aGo" type="submit">Se connecter</button>
    </form>
    <p class="amsg" id="aMsg" role="alert"></p>
    <button class="linkbtn" id="aSwitch" type="button">Pas encore de compte ? Créer un compte</button>
  </section>
  <div id="app" hidden>
  <h1>Qu’est-ce qu’on achète ?</h1>
  <p class="sub" id="count"></p>
  <div class="listbar">
    <div class="lists" id="lists"></div>
    <button class="ico no share-btn" id="shareBtn" type="button" aria-expanded="false" aria-controls="sharePanel" aria-label="Partager" title="Partager"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg></button>
  </div>
  <form id="newForm" hidden>
    <input type="text" id="newIn" placeholder="Nom de la liste (ex. Bricolage)" aria-label="Nom de la nouvelle liste" autocomplete="off" maxlength="30">
    <button class="ico" type="submit" aria-label="Créer la liste" title="Créer"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
  </form>
  <section class="share" id="sharePanel" hidden>
    <p class="lbl">Code de cette liste</p>
    <p class="row"><strong id="code"></strong> <button class="ico" id="copy" type="button" aria-label="Copier le code" title="Copier le code"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg></button></p>
    <p>Chaque liste a son propre code.</p>
    <form id="join">
      <input type="text" id="joinIn" placeholder="Rejoindre une liste (code)" aria-label="Code d’une liste" autocomplete="off" maxlength="24">
      <button class="ico" type="submit" aria-label="Rejoindre cette liste" title="Rejoindre"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button>
    </form>
    <form id="rename">
      <input type="text" id="renameIn" aria-label="Nom de la liste" autocomplete="off" maxlength="30">
      <button class="ico" type="submit" aria-label="Renommer la liste" title="Renommer"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    </form>
    <p class="lbl">Compte</p>
    <p class="row"><strong id="acct"></strong> <button class="ico no" id="logout" type="button" aria-label="Se déconnecter" title="Se déconnecter"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20H10"/><path d="M15 8l4 4-4 4M19 12H9"/></svg></button></p>
  </section>
  <form id="form">
    <input type="text" id="input" placeholder="Ex. Banane 3, Porc 500 g" aria-label="Nouveau produit" autocomplete="off" maxlength="80">
    <button class="add plus" type="submit" aria-label="Ajouter le produit" title="Ajouter"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </form>
  <div class="chips" id="chips"></div>
  <div id="groups"></div>
  <section class="panel">
    <p id="status"></p>
    <button class="clear" id="clear" type="button">Retirer les produits cochés</button>
  </section>
  </div>
</main>
</div>
<div class="modal" id="modal" hidden>
  <div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="mTitle" aria-describedby="mText">
    <h2 id="mTitle"></h2>
    <p id="mText"></p>
    <div class="acts">
      <button class="mini" id="mNo" type="button">Annuler</button>
      <button class="mini" id="mYes" type="button">Retirer</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};

/* ---------- Rayons ---------- */
var RAYONS=[
["Fruits et légumes","banane,pomme,poire,orange,citron,clémentine,kiwi,fraise,framboise,raisin,pêche,abricot,melon,pastèque,ananas,mangue,avocat,tomate,salade,laitue,carotte,courgette,aubergine,poivron,concombre,oignon,ail,échalote,pomme de terre,champignon,épinard,brocoli,chou,haricot,petit pois,radis,poireau,persil,basilic,coriandre,ciboulette"],
["Boucherie et poissonnerie","porc,bœuf,veau,agneau,poulet,dinde,canard,jambon,lardons,saucisse,steak,viande hachée,rôti,escalope,merguez,saumon,thon,cabillaud,poisson,crevettes"],
["Crèmerie","lait,beurre,crème,yaourt,fromage,œufs,emmental,mozzarella,parmesan,camembert,chèvre,skyr,fromage blanc"],
["Boulangerie","pain,baguette,brioche,croissant"],
["Épicerie","pâtes,riz,farine,sucre,sel,poivre,huile,vinaigre,sauce tomate,ketchup,moutarde,mayonnaise,céréales,biscuits,chocolat,confiture,miel,café,thé,conserve,lentilles,pois chiche,semoule"],
["Boissons","eau,jus d’orange,soda,cola,bière,vin,cidre,sirop,limonade"],
["Surgelés","glace,frites,nuggets,pizza surgelée,légumes surgelés"],
["Maison et hygiène","savon,shampoing,dentifrice,papier toilette,essuie-tout,lessive,liquide vaisselle,éponge,sacs poubelle,mouchoirs,coton,déodorant,gel douche"]
];
var norm=function(s){return s.toLowerCase().replace(/œ/g,"oe").replace(/æ/g,"ae").replace(/[’‘]/g,"'").normalize("NFD").replace(/[\u0300-\u036f]/g,"");};
var sing=function(w){return w.length>3?w.replace(/[sx]$/,""):w;};
var cap=function(s){return s.charAt(0).toUpperCase()+s.slice(1);};
var ORDER=RAYONS.map(function(r){return r[0];}).concat(["Autres"]);
var MULTI=[], SINGLE={}, CATALOG=[];
RAYONS.forEach(function(r,i){
  r[1].split(",").forEach(function(k){
    CATALOG.push(k); var n=norm(k);
    if(n.indexOf(" ")>-1||n.indexOf("'")>-1) MULTI.push([n,i]); else SINGLE[sing(n)]=i;
  });
});
function cat(name){
  var n=norm(name), i;
  for(i=0;i<MULTI.length;i++) if(n.indexOf(MULTI[i][0])>-1) return RAYONS[MULTI[i][1]][0];
  var ws=n.split(/[^a-z0-9]+/);
  for(i=0;i<ws.length;i++){ var s=sing(ws[i]); if(Object.prototype.hasOwnProperty.call(SINGLE,s)) return RAYONS[SINGLE[s]][0]; }
  return "Autres";
}
function catOf(it){return ORDER.indexOf(it.cat)>-1?it.cat:"Autres";}

/* ---------- Détection des quantités ---------- */
function parse(text){
  var t=text.trim().replace(/\s+/g," "), name=t, n="", u="", m;
  m=t.match(/^(.+?)\s*[x×]?\s*(\d+(?:[.,]\d+)?)\s*(kg|mg|ml|cl|g|l|x|×|pièces?|pcs?|paquets?|boîtes?|bouteilles?|packs?)?\.?$/i);
  if(m && /[a-zA-ZÀ-ÿ]/.test(m[1])){ name=m[1]; n=m[2]; u=m[3]||""; }
  else{
    m=t.match(/^(\d+(?:[.,]\d+)?)\s*(kg|mg|ml|cl|g|l|x|×|pièces?|pcs?|paquets?|boîtes?|bouteilles?|packs?)?\s+(?:de |d['’]|des )?(.+)$/i);
    if(m){ n=m[1]; u=m[2]||""; name=m[3]; }
  }
  var qty=!n?"":(/^[x×]$/i.test(u)?"×"+n:n+(u?" "+u:""));
  name=name.replace(/[\s,;:-]+$/,"");
  if(!name){ name=t; qty=""; }
  return {name:cap(name), qty:qty};
}

/* ---------- Réglages ---------- */
var SUPABASE_URL="https://xkaavztthqibpluhauur.supabase.co";
var SUPABASE_KEY="sb_publishable_82RYUYfJAgcLGp43rzPrtw_W42giZbX";

/* ---------- État ---------- */
var db=null, session=null, meId="", live=false, offline=false, errMsg="";
var items=[], habits=[], loc={items:[],habits:[]}, names={}, editing=null, editVal="", unsub=[];
var CODE_RE=/^[a-z0-9-]{3,24}$/;
var myName="", code="", lists=[];
function readCode(){var h=location.hash.replace(/^#/,"").toLowerCase();return CODE_RE.test(h)?h:"";}
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);};
var key=function(n){return norm(n).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"x";};
var lk=function(k){return "courses:"+k+":"+code;};
function readLS(k){try{var v=JSON.parse(localStorage.getItem(k)||"null");return Array.isArray(v)?v:null;}catch(e){return null;}}
function loadLocal(){
  var it=readLS(lk("items"))||[], hb=readLS(lk("habits"))||[];
  it.forEach(function(x){
    if(x.name===undefined){var p=parse(x.text||"");x.name=p.name;x.qty=p.qty;}
    if(!x.cat) x.cat=cat(x.name); if(!x.ts) x.ts=0; if(!x.id) x.id=uid();
  });
  loc={items:it,habits:hb};
}
/* Copie de la dernière version connue, pour l'affichage hors connexion. */
function saveLocal(){try{localStorage.setItem(lk("items"),JSON.stringify(items));localStorage.setItem(lk("habits"),JSON.stringify(habits));}catch(e){}}
var col=function(){return db.collection("lists/"+code+"/items");};
var hcol=function(){return db.collection("lists/"+code+"/habits");};
function fail(){errMsg="Modification impossible pour le moment (connexion ou droits). Réessayez.";renderStatus();}

/* ---------- Compte : session et appels au serveur ---------- */
var SKEY="courses:session";
function loadSession(){
  try{var s=JSON.parse(localStorage.getItem(SKEY)||"null");session=(s&&s.access_token&&s.refresh_token&&s.user&&s.user.id)?s:null;}catch(e){session=null;}
}
function saveSession(){try{if(session)localStorage.setItem(SKEY,JSON.stringify(session));else localStorage.removeItem(SKEY);}catch(e){}}
function setSession(j){
  var exp=j.expires_at||(Math.floor(Date.now()/1000)+(j.expires_in||3600));
  session={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:exp,user:{id:j.user.id,email:j.user.email||""}};
  saveSession();
}
function httpJson(url,opts){
  return fetch(url,opts).then(function(r){
    return r.text().then(function(t){
      var j=null; try{j=t?JSON.parse(t):null;}catch(e){}
      if(!r.ok){
        var er=new Error((j&&(j.msg||j.message||j.error_description))||("HTTP "+r.status));
        er.status=r.status; er.code=(j&&(j.error_code||j.code))||""; throw er;
      }
      return j;
    });
  });
}
function authCall(path,body,tk){
  var h={"apikey":SUPABASE_KEY,"Content-Type":"application/json"}; if(tk) h.Authorization="Bearer "+tk;
  return httpJson(SUPABASE_URL+"/auth/v1/"+path,{method:"POST",headers:h,body:JSON.stringify(body||{})});
}
var refreshing=null;
function refreshSession(){
  if(refreshing) return refreshing;
  var rt=session&&session.refresh_token; if(!rt) return Promise.reject(new Error("non connecté"));
  refreshing=authCall("token?grant_type=refresh_token",{refresh_token:rt}).then(function(j){
    setSession(j); refreshing=null; return session;
  },function(e){
    refreshing=null;
    if(e.status===400||e.status===401||e.status===403) signedOut("Session expirée : reconnectez-vous.");
    throw e;
  });
  return refreshing;
}
function accessToken(){
  if(!session) return Promise.reject(new Error("non connecté"));
  if(session.expires_at-60>Date.now()/1000) return Promise.resolve(session.access_token);
  return refreshSession().then(function(s){return s.access_token;});
}
function rpc(fn,args){
  function go(tk){
    return httpJson(SUPABASE_URL+"/rest/v1/rpc/"+fn,{method:"POST",
      headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+tk,"Content-Type":"application/json"},body:JSON.stringify(args||{})});
  }
  return accessToken().then(go).catch(function(e){
    if(e&&e.status===401&&session) return refreshSession().then(function(s){return go(s.access_token);});
    throw e;
  }).then(function(j){
    if(offline){offline=false;renderStatus();}
    return j;
  },function(e){
    if(!e.status&&session&&!offline){offline=true;renderStatus();}
    throw e;
  });
}
function wipeLocal(){
  try{
    var ks=[]; for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i); if(k&&k.indexOf("courses:")===0) ks.push(k);}
    ks.forEach(function(k){localStorage.removeItem(k);});
  }catch(e){}
}
function signedOut(msg){
  unsub.forEach(function(f){f();}); unsub=[];
  db=null; live=false; session=null; offline=false;
  wipeLocal(); items=[]; habits=[]; lists=[]; names={}; code=""; myName=""; errMsg="";
  showAuth(msg||"");
}

/* ---------- Plusieurs listes (rattachées au compte) ---------- */
function saveLists(){try{localStorage.setItem("courses:lists",JSON.stringify(lists));}catch(e){}}
function entry(c){return lists.find(function(e){return e.code===c;});}
var dname=function(e){return e.name||"Liste "+e.code;};
function showNew(on){
  $("newForm").hidden=!on; $("form").hidden=on; $("chips").hidden=on;
  if(on) $("newIn").focus();
}
function renderLists(){
  var box=$("lists"); box.textContent="";
  lists.forEach(function(e){
    var b=btn(dname(e),"tab"+(e.code===code?" on":""),"button");
    if(e.code===code) b.setAttribute("aria-current","true");
    b.title="Maintenir appuyé pour retirer la liste de votre compte";
    var t=null, fired=false;
    b.addEventListener("pointerdown",function(ev){
      if(ev.button>0) return; fired=false; clearTimeout(t);
      t=setTimeout(function(){t=null;fired=true;openDel(e);},600);
    });
    ["pointerup","pointerleave","pointercancel"].forEach(function(n){b.addEventListener(n,function(){clearTimeout(t);t=null;});});
    b.addEventListener("contextmenu",function(ev){ev.preventDefault();});
    b.addEventListener("keydown",function(ev){if(ev.key==="Delete"){ev.preventDefault();openDel(e);}});
    b.addEventListener("click",function(){if(fired){fired=false;return;} if(e.code!==code)setCode(e.code);});
    box.appendChild(b);
  });
  var n=btn("+","tab new","button"); n.setAttribute("aria-label","Nouvelle liste"); n.title="Nouvelle liste";
  n.addEventListener("click",function(){var f=$("newForm");showNew(f.hidden);});
  box.appendChild(n);

function createDefault(){
  return rpc("list_create",{p_name:"Courses"}).then(function(c){lists=[{code:c,name:"Courses"}];saveLists();return c;});
}
function leaveList(c){
  rpc("list_leave",{p_code:c}).then(function(){
    try{localStorage.removeItem("courses:items:"+c);localStorage.removeItem("courses:habits:"+c);}catch(e){}
    lists=lists.filter(function(x){return x.code!==c;}); saveLists();
    if(!lists.length) return createDefault().then(function(n){setCode(n);});
    if(c===code) setCode(lists[0].code); else renderLists();
  }).catch(function(){errMsg="Impossible de retirer la liste pour le moment.";renderStatus();});
}
/* Recharge régulièrement la liste de vos listes (créées ou retirées depuis un autre appareil). */
function syncLists(){
  if(!session||!db||document.visibilityState!=="visible") return;
  rpc("my_lists").then(function(arr){
    if(!Array.isArray(arr)) return;
    var sig=function(a){return JSON.stringify(a.map(function(x){return [x.code,x.name];}));};
    if(sig(arr)===sig(lists)) return;
    lists=arr; saveLists();
    if(!lists.length){createDefault().then(function(c){setCode(c);});return;}
    if(!entry(code)) setCode(lists[0].code); else renderLists();
  }).catch(function(){});
}

/* ---------- Actions ---------- */
function write(it){col().doc(it.id).set(it).catch(fail);}
function patch(it,f){col().doc(it.id).update(f).catch(fail);}
function remove(it){col().doc(it.id).delete().catch(fail);}
function bumpHabit(p,c){
  var k=key(p.name), prev=habits.find(function(h){return h.id===k;});
  var h={id:k,name:p.name,qty:p.qty,cat:c,n:(prev?prev.n:0)+1,ts:Date.now()};
  hcol().doc(k).set(h).catch(function(){});
}
function addItem(text){
  var t=text.trim(); if(!t) return; errMsg="";
  var p=parse(t), c=cat(p.name);
  write({id:uid(),text:t,name:p.name,qty:p.qty,cat:c,done:false,by:meId,who:myName,ts:Date.now()});
  bumpHabit(p,c); renderStatus();
}

/* ---------- Synchronisation de la liste ouverte ---------- */
function start(){
  unsub.forEach(function(f){f();}); unsub=[]; names={}; editing=null; live=false;
  loadLocal(); items=loc.items.slice(); habits=loc.habits.slice();
  if(db){
    live=true;
    unsub.push(col().onSnapshot(function(s){
      items=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id});}).sort(function(a,b){return (a.ts||0)-(b.ts||0);});
      saveLocal(); render();
    },function(){}));
    unsub.push(db.doc("lists/"+code).onSnapshot(function(d){
      var data=d.exists&&d.data(), en=entry(code);
      if(data){
        if(en&&data.name!==undefined&&en.name!==data.name){en.name=data.name;saveLists();}
        if(data.members){
          names={}; Object.keys(data.members).forEach(function(k){names[k]={name:data.members[k]};});
          render();
        }
      }
      renderLists();
    },function(){}));
    unsub.push(hcol().onSnapshot(function(s){
      habits=s.docs.map(function(d){return Object.assign({},d.data(),{id:d.id});}); saveLocal(); renderChips();
    },function(){}));
  }
  $("code").textContent=code; render(); renderLists();
}
function setCode(c){
  showNew(false);
  if(!entry(c)) return;
  code=c; try{localStorage.setItem("courses:code",code);}catch(e){}
  try{if(location.hash.replace(/^#/,"")!==code) location.hash=code;}catch(e){}
  start();
}

function row(it){
  var li=document.createElement("li"); if(it.done) li.className="done";
  if(editing===it.id){
    var f=document.createElement("form"); f.className="editf";
    var inp=document.createElement("input"); inp.type="text"; inp.className="edit"; inp.maxLength=80; inp.value=editVal;
    inp.setAttribute("aria-label","Modifier le produit");
    inp.addEventListener("input",function(){editVal=inp.value;});
    var no=btn("✕","ico no","button"); no.setAttribute("aria-label","Annuler"); no.title="Annuler";
    no.addEventListener("click",function(){editing=null;render();});
    f.addEventListener("submit",function(e){
      e.preventDefault(); var t=inp.value.trim(); editing=null;
      if(t&&t!==it.text){var p=parse(t);patch(it,{text:t,name:p.name,qty:p.qty,cat:cat(p.name)});}
      render();
    });
    f.appendChild(inp); var ok=btn("✓","ico","submit"); ok.setAttribute("aria-label","Enregistrer"); ok.title="Enregistrer"; f.appendChild(ok); f.appendChild(no); li.appendChild(f); return li;
  }
  var cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!!it.done; cb.setAttribute("aria-label","Cocher "+it.name);
  cb.addEventListener("change",function(){patch(it,{done:cb.checked});});
  var nm=document.createElement("button"); nm.type="button"; nm.className="name"; nm.textContent=it.name; nm.title="Modifier";
  nm.addEventListener("click",function(){editing=it.id;editVal=it.text||(it.name+(it.qty?" "+it.qty:""));render();});
  li.appendChild(cb); li.appendChild(nm);
  if(it.qty){var q=document.createElement("span");q.className="qty";q.textContent=it.qty;li.appendChild(q);}
  if(it.by){
    var n=names[it.by], s=document.createElement("span"); s.className="ini";
    var nmv=(n&&n.name)||it.who||""; s.textContent=(nmv||"?").charAt(0).toUpperCase(); s.title=nmv||"Ajouté par quelqu’un";
    if(n&&n.color) s.style.borderColor=n.color; li.appendChild(s);
  }
  var d=btn("×","del","button"); d.setAttribute("aria-label","Supprimer "+it.name);
  d.addEventListener("click",function(){remove(it);}); li.appendChild(d);
  return li;
}
function section(title,arr){
  var sec=document.createElement("section"); sec.className="grp";
  var h=document.createElement("h2"); h.textContent=title;
  var k=document.createElement("span"); k.textContent=arr.length; h.appendChild(k);
  var ul=document.createElement("ul"); arr.forEach(function(it){ul.appendChild(row(it));});
  sec.appendChild(h); sec.appendChild(ul); return sec;
}
function render(){
  var g=$("groups"); g.textContent="";
  if(!items.length){
    var ul=document.createElement("ul"), li=document.createElement("li"); li.className="empty";
    li.textContent="La liste est vide. Ajoutez votre premier produit."; ul.appendChild(li); g.appendChild(ul);
  }else{
    var byTs=function(x,y){return (x.ts||0)-(y.ts||0);};
    ORDER.forEach(function(c){
      var arr=items.filter(function(i){return !i.done&&catOf(i)===c;}).sort(byTs);
      if(arr.length) g.appendChild(section(c,arr));
    });
    var dn=items.filter(function(i){return i.done;}).sort(function(x,y){return (ORDER.indexOf(catOf(x))-ORDER.indexOf(catOf(y)))||byTs(x,y);});
    if(dn.length) g.appendChild(section("Dans le panier",dn));
  }
  var left=items.filter(function(i){return !i.done;}).length, done=items.length-left;
  $("count").textContent=!items.length?"Rien à acheter pour l’instant":left===0?"Tout est dans le panier":left+(left>1?" produits restants":" produit restant");
  $("clear").disabled=done===0;
  renderChips(); renderStatus();
  if(editing){var e=g.querySelector(".edit");if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length);}}
}
function renderStatus(){
  $("status").textContent=errMsg||(offline?"Hors connexion : dernière version enregistrée sur cet appareil":live?"Liste partagée et synchronisée automatiquement":"Connexion en cours…");
}
function renderChips(){
  var box=$("chips"); box.textContent="";
  var typed=$("input").value, q=norm(parse(typed).name), list=[], label="";
  var byUse=habits.slice().sort(function(a,b){return (b.n-a.n)||((b.ts||0)-(a.ts||0));});
  if(q.length>=2&&typed.trim()){
    label="Suggestions"; var seen={};
    byUse.map(function(h){return {name:h.name,qty:h.qty};}).concat(CATALOG.map(function(k){return {name:cap(k),qty:""};})).forEach(function(c){
      var n=norm(c.name);
      if(n===q||seen[n]||list.length>=5) return;
      if(n.indexOf(q)===0||n.split(/[^a-z0-9]+/).some(function(w){return w.indexOf(q)===0;})){seen[n]=1;list.push(c);}
    });
  }else{
    label="Habituels";
    var inList={}; items.forEach(function(i){inList[key(i.name)]=1;});
    list=byUse.filter(function(h){return !inList[h.id];}).slice(0,6);
  }
  if(!list.length) return;
  var l=document.createElement("span"); l.className="lbl"; l.textContent=label; box.appendChild(l);
  list.forEach(function(c){
    var b=btn(c.name,"chip","button");
    b.addEventListener("click",function(){
      if(label==="Habituels"){addItem(c.name+(c.qty?" "+c.qty:""));}
      else{var p=parse($("input").value);$("input").value=c.name+(p.qty?" "+p.qty:c.qty?" "+c.qty:"");$("input").focus();renderChips();}
    });
    box.appendChild(b);
  });
}

function showAuth(msg){$("auth").hidden=false;$("app").hidden=true;$("aMsg").textContent=msg||"";setMode(authMode);}

function authError(e){
  var m=((e&&e.message)||"").toLowerCase(), c=((e&&e.code)||"")+"";
  if(!e||!e.status) return "Connexion impossible. Vérifiez votre réseau.";
  if(c==="invalid_credentials"||m.indexOf("invalid login")>-1) return "E-mail ou mot de passe incorrect.";
  if(c==="email_not_confirmed") return "Confirmez d’abord votre adresse e-mail grâce au message reçu.";
  if(c==="user_already_exists"||m.indexOf("already registered")>-1) return "Un compte existe déjà avec cet e-mail.";
  if(c==="weak_password") return "Mot de passe trop faible : choisissez-en un plus long.";
  if(c==="signup_disabled") return "La création de compte est désactivée.";
  if(e.status===429||c.indexOf("rate_limit")>-1) return "Trop de tentatives. Réessayez dans quelques minutes.";
  if(c==="validation_failed"||m.indexOf("valid email")>-1) return "Adresse e-mail non valide.";
  return "Une erreur est survenue ("+e.status+"). Réessayez.";
}

$("authForm").addEventListener("submit",function(ev){

  var go=$("aGo"); go.disabled=true;
  var p=su?authCall("signup",{email:email,password:pass,data:{name:name}})
          :authCall("token?grant_type=password",{email:email,password:pass});

    if(!j||!j.access_token){

/* ---------- Synchronisation avec Supabase ---------- */
function makeSupabase(){
  var rooms={}, timer=null, lastWrite=0;
  function room(c){return rooms[c]||(rooms[c]={items:{},habits:{},exists:false,name:"",members:{},loaded:false,busy:false,sig:{},subs:{items:[],habits:[],doc:[]}});}
  function colSnap(m){var ids=Object.keys(m);return {empty:!ids.length,docs:ids.map(function(id){return {id:id,data:function(){return m[id];}};})};}
  function docSnap(r){return {exists:r.exists,data:function(){return {name:r.name,members:r.members};}};}
  function emit(c){
    var r=room(c), sg={items:JSON.stringify(r.items),habits:JSON.stringify(r.habits),doc:r.exists+"|"+r.name+"|"+JSON.stringify(r.members)};
    if(sg.items!==r.sig.items) r.subs.items.slice().forEach(function(f){f(colSnap(r.items));});
    if(sg.habits!==r.sig.habits) r.subs.habits.slice().forEach(function(f){f(colSnap(r.habits));});
    if(sg.doc!==r.sig.doc) r.subs.doc.slice().forEach(function(f){f(docSnap(r));});
    r.sig=sg;
  }
  function poll(c){
    var r=room(c); if(r.busy) return; r.busy=true; var t0=Date.now();
    rpc("list_get",{p_code:c}).then(function(d){
      r.busy=false; if(!d||t0<lastWrite) return;
      r.exists=!!d.exists; r.name=d.name||""; r.members=d.members||{}; r.items={}; r.habits={};
      (d.items||[]).forEach(function(x){r.items[x.id]=x;});
      (d.habits||[]).forEach(function(x){r.habits[x.id]=x;});
      r.loaded=true; emit(c);
    }).catch(function(){r.busy=false;});
  }
  function tick(){
    if(document.visibilityState!=="visible"||navigator.onLine===false) return;
    Object.keys(rooms).forEach(function(c){var s=rooms[c].subs; if(s.items.length||s.habits.length||s.doc.length) poll(c);});
  }
  function listen(c,kind,cb){
    var r=room(c); r.subs[kind].push(cb);
    if(!timer){timer=setInterval(tick,4000);document.addEventListener("visibilitychange",tick);window.addEventListener("online",tick);}
    if(r.loaded) setTimeout(function(){if(r.subs[kind].indexOf(cb)>-1) cb(kind==="doc"?docSnap(r):colSnap(r[kind]));},0);
    else poll(c);
    return function(){var i=r.subs[kind].indexOf(cb);if(i>-1)r.subs[kind].splice(i,1);};
  }
  function write(c,fn,args,apply){
    var r=room(c); lastWrite=Date.now(); apply(r); emit(c);
    return rpc(fn,args).then(function(){lastWrite=Date.now();},function(e){lastWrite=0;poll(c);throw e;});
  }
  function path(p){var a=p.split("/");return {code:a[1],kind:a[2]};}
  return {
    collection:function(p){
      var q=path(p), c=q.code, kind=q.kind;
      return {
        onSnapshot:function(cb){return listen(c,kind,cb);},
        doc:function(id){
          var d={
            set:function(obj){
              return write(c,kind==="items"?"item_put":"habit_put",kind==="items"?{p_code:c,p_item:obj}:{p_code:c,p_habit:obj},function(r){r[kind][id]=obj;});
            },
            update:function(f){
              var base=room(c)[kind][id]; if(!base) return Promise.reject(new Error("absent"));
              return d.set(Object.assign({},base,f));
            },
            "delete":function(){return write(c,"item_delete",{p_code:c,p_id:id},function(r){delete r[kind][id];});}
          };
          return d;
        }
      };
    },
    doc:function(p){
      var c=path(p).code;
      return {
        onSnapshot:function(cb){return listen(c,"doc",cb);},
        set:function(o){var n=(o&&o.name)||"";return write(c,"list_set_name",{p_code:c,p_name:n},function(r){r.exists=true;r.name=n;});}
      };
    }
  };
}

/* ---------- Démarrage ---------- */
function storedCode(){try{return localStorage.getItem("courses:code")||"";}catch(e){return "";}}
function enterApp(){
  showApp(); meId=session.user.id; $("acct").textContent=session.user.email||"";
  /* Les listes utilisées avant l'arrivée des comptes sont rattachées au compte (une seule fois par compte). */
  var old=[]; try{var v=JSON.parse(localStorage.getItem("courses:lists")||"null");if(Array.isArray(v))old=v.filter(function(e){return e&&CODE_RE.test(e.code);});}catch(e){}
  var flag="courses:migrated:"+session.user.id, migrated=false; try{migrated=localStorage.getItem(flag)==="1";}catch(e){}
  var netFail=false, chain=Promise.resolve();
  db=makeSupabase();
  if(!migrated) old.forEach(function(e){chain=chain.then(function(){return rpc("list_join",{p_code:e.code}).catch(function(er){if(!er.status)netFail=true;});});});
  chain.then(function(){return Promise.all([rpc("profile_get"),rpc("my_lists")]);}).then(function(r){
    if(!netFail){try{localStorage.setItem(flag,"1");}catch(e){}}
    myName=(r[0]&&r[0].name)||"";
    if(!myName){var em=(session.user.email||"").split("@")[0].replace(/[^A-Za-zÀ-ÿ]+/g," ").trim().split(" ")[0]||"";
      if(em){myName=em.charAt(0).toUpperCase()+em.slice(1,20);rpc("profile_set",{p_name:myName}).catch(function(){});}}
    lists=Array.isArray(r[1])?r[1]:[];
    return lists.length?null:createDefault();
  }).then(function(){
    saveLists();
    var want=readCode()||storedCode(); code=entry(want)?want:lists[0].code;
    try{localStorage.setItem("courses:code",code);}catch(e){}
    try{if(location.hash.replace(/^#/,"")!==code) location.hash=code;}catch(e){}
    start();
  }).catch(function(){
    if(!session) return;
    var cached=[]; try{var c=JSON.parse(localStorage.getItem("courses:lists")||"null");if(Array.isArray(c))cached=c;}catch(e){}
    lists=cached.filter(function(e){return e&&CODE_RE.test(e.code);});
    if(lists.length){var want=readCode()||storedCode();code=entry(want)?want:lists[0].code;start();}
    else{errMsg="Impossible de charger vos listes pour le moment.";renderStatus();setTimeout(function(){if(session&&!code)enterApp();},5000);}
  });
}
setInterval(syncLists,10000);
document.addEventListener("visibilitychange",syncLists);
loadSession();
if(session) enterApp(); else showAuth("");
})();
